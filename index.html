<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的英语单词本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#eadfcb;
  --paper:#fffdf6;
  --line:#cfe0f3;
  --margin:#f2a5a5;
  --ink:#1d3c8f;
  --red:#c2410c;
  --pencil:#4a4a4a;
  --hand:"Patrick Hand","Caveat","Comic Sans MS","Chalkboard SE",cursive;
  --kai:"KaiTi","STKaiti","Kaiti SC","楷体","楷体_GB2312",serif;
  --lh:32px;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--desk);
  background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);
  background-size:6px 6px;
  font-family:var(--kai);
  color:var(--pencil);
}
.notebook{
  position:relative;
  max-width:1040px;
  margin:28px auto 40px;
  background:var(--paper);
  border-radius:6px 16px 16px 6px;
  box-shadow:0 1px 0 #e6dccb,0 3px 0 #f3ecdf,0 5px 0 #e6dccb,0 14px 30px rgba(80,60,30,.22);
  padding:36px 34px 40px 104px;
  overflow:hidden;
}
/* 红色页边线 */
.notebook::before{
  content:"";position:absolute;top:0;bottom:0;left:82px;width:2px;background:var(--margin);
}
/* 活页孔 */
.notebook::after{
  content:"";position:absolute;top:0;bottom:0;left:22px;width:34px;
  background:radial-gradient(circle at 17px 24px,var(--desk) 8px,#d8cbb3 9px,transparent 10px) repeat-y;
  background-size:34px 56px;
}
/* 装饰：樱花与蝴蝶 */
.doodle{position:absolute;pointer-events:none;opacity:.55}
.d1{top:18px;right:26px;width:86px}
.d2{top:150px;right:120px;width:46px;opacity:.4;transform:rotate(-18deg)}
.d3{bottom:30px;right:40px;width:70px;transform:rotate(12deg)}

header{position:relative;z-index:1;margin-bottom:10px}
.label{
  display:inline-block;background:#fff;border:2px solid #333;border-radius:10px;
  padding:10px 22px 6px;transform:rotate(-1.2deg);box-shadow:3px 3px 0 #333;
}
h1{margin:0;font-family:var(--kai);font-size:2rem;color:#222;letter-spacing:2px}
h1 small{display:block;font-family:var(--hand);font-size:1.2rem;color:var(--ink);letter-spacing:0;margin-top:2px}
.sub{font-family:var(--kai);margin:14px 0 0;font-size:1.05rem;color:#777}

/* 搜索 */
.search-wrap{position:relative;z-index:1;margin:22px 0 16px;max-width:520px}
.search{
  width:100%;border:0;border-bottom:2px dashed #9bb3d6;background:transparent;
  font-family:var(--kai);font-size:1.15rem;padding:8px 4px 6px 34px;color:var(--ink);outline:none;
}
.search::placeholder{color:#9aa7bb}
.search-wrap::before{content:"✎";position:absolute;left:4px;top:6px;font-size:1.3rem;color:#9bb3d6}

/* 分类标签（便利贴） */
.tabs{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.tab{
  border:0;cursor:pointer;font-family:var(--kai);font-size:1.02rem;color:#333;
  padding:7px 14px 6px;border-radius:3px;box-shadow:1px 2px 0 rgba(0,0,0,.15);
  transition:transform .15s, box-shadow .15s;
}
.tab:nth-child(odd){transform:rotate(-1.5deg)}
.tab:nth-child(even){transform:rotate(1.2deg)}
.tab:hover{transform:translateY(-2px) rotate(0)}
.tab.on{transform:translateY(-4px) rotate(0) scale(1.05);box-shadow:2px 5px 0 rgba(0,0,0,.22);outline:2px solid #333}
.tab .n{font-family:var(--hand);font-size:.95rem;opacity:.7;margin-left:4px}

.filters2{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:-6px 0 20px}
.flabel{font-family:var(--kai);color:#888;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px dashed #9bb3d6;background:transparent;border-radius:999px;padding:2px 12px;cursor:pointer;font-family:var(--kai);font-size:.95rem;color:#5a6a85}
.chip.on{background:var(--ink);color:#fff;border-style:solid;border-color:var(--ink)}
.srcsel{font-family:var(--kai);font-size:.98rem;color:var(--ink);background:transparent;border:0;border-bottom:2px dashed #9bb3d6;padding:4px 2px;max-width:100%;outline:none}
.src{font-family:var(--kai);font-size:.82rem;color:#a6a6a6}
.count{position:relative;z-index:1;font-family:var(--hand);font-size:1.2rem;color:var(--red);margin:0 0 4px}

/* 横线纸上的单词 */
.entries{
  position:relative;z-index:1;
  display:grid;grid-template-columns:repeat(2,1fr);column-gap:40px;row-gap:var(--lh);
  background-image:repeating-linear-gradient(transparent 0 calc(var(--lh) - 1px),var(--line) calc(var(--lh) - 1px) var(--lh));
  background-position:0 0;
  padding-top:0;
  line-height:var(--lh);
}
.entry{line-height:var(--lh)}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;height:var(--lh);overflow:visible}
.en{
  font-family:var(--hand);font-size:1.65rem;color:var(--ink);
  background:linear-gradient(transparent 58%,rgba(255,236,90,.75) 58%);
  padding:0 3px;line-height:var(--lh);
}
.pos{font-family:var(--hand);font-size:1.05rem;color:#888}
.say{
  border:0;background:transparent;cursor:pointer;font-size:1rem;line-height:1;padding:2px;
  opacity:.65;
}
.say:hover{opacity:1}
.tag{
  margin-left:auto;font-family:var(--kai);font-size:.85rem;line-height:1.4;padding:1px 8px;border-radius:2px;
  color:#333;opacity:.9;transform:rotate(2deg);
}
.zh{font-family:var(--kai);font-size:1.3rem;color:var(--red);font-weight:bold}
.def{font-family:var(--kai);font-size:1.08rem;color:#333}
.ex{font-family:var(--hand);font-size:1.12rem;color:#5a6a85}
.ex .exzh{font-family:var(--kai);font-size:1rem;color:#888}
.empty{grid-column:1/-1;font-family:var(--kai);font-size:1.2rem;color:#999;text-align:center}

footer{position:relative;z-index:1;margin-top:40px;text-align:right;font-family:var(--kai);color:#999;font-size:.95rem}

@media (max-width:720px){
  .notebook{padding:26px 16px 30px 62px;margin:12px 8px 30px}
  .notebook::before{left:48px}
  .notebook::after{left:8px;width:30px;background-size:30px 50px;
    background-image:radial-gradient(circle at 14px 22px,var(--desk) 7px,#d8cbb3 8px,transparent 9px)}
  .entries{grid-template-columns:1fr}
  h1{font-size:1.6rem}
  .d1{width:60px;right:12px}
  .d2{display:none}
}
</style>
</head>

  <header>
    <div class="label">
      <h1>我的英语单词本<small>My English Notebook</small></h1>
    </div>
    <p class="sub">一页一页，慢慢积累 🌸 按主题、词性或来源查找，点 🔊 可以听发音</p>

  <div class="search-wrap">

}

const WORDS = RAW.split("\n").filter(Boolean).map(line => {
  const [en,pos,zh,def,ex,exzh,cat,src] = line.split("|");
  return {en,pos,zh,def,ex,exzh,cat,src,groups:posGroups(pos)};
});

const tabsEl = document.getElementById('tabs');
const chipsEl = document.getElementById('chips');
const srcEl = document.getElementById('srcsel');
const listEl = document.getElementById('entries');
const countEl = document.getElementById('count');
const searchEl = document.getElementById('search');
const canSpeak = 'speechSynthesis' in window;
let curCat = "全部", curPos = "全部";

function say(text){
  try{
    const u = new SpeechSynthesisUtterance(text.replace(/\(.*?\)/g,''));
    u.lang = 'en-US'; u.rate = 0.85;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function buildTabs(){
  tabsEl.innerHTML = '';
  const all = [["全部",{icon:"📒",color:"#fff3b0"}], ...Object.entries(CATS)];
  all.forEach(([name,c]) => {
    const n = name === "全部" ? WORDS.length : WORDS.filter(w => w.cat === name).length;
    if (!n) return;
    const b = document.createElement('button');
    b.className = 'tab' + (name === curCat ? ' on' : '');
    b.style.background = c.color;
    b.innerHTML = c.icon + ' ' + name + '<span class="n">' + n + '</span>';
    b.addEventListener('click', () => { curCat = name; buildTabs(); render(); });
    tabsEl.appendChild(b);
  });
}

function buildChips(){
  chipsEl.innerHTML = '';
  POS.forEach(p => {
    const b = document.createElement('button');
    b.className = 'chip' + (p === curPos ? ' on' : '');
    b.textContent = p;
    b.addEventListener('click', () => { curPos = p; buildChips(); render(); });
    chipsEl.appendChild(b);
  });
}

function buildSources(){
  const opt = (v,t) => { const o = document.createElement('option'); o.value = v; o.textContent = t; srcEl.appendChild(o); };
  opt("", "全部来源");
  Object.entries(SOURCES).forEach(([k,v]) => {
    const n = WORDS.filter(w => w.src === k).length;
    if (n) opt(k, v + "（" + n + "）");
  });
  srcEl.addEventListener('change', render);
}

function render(){
  const q = searchEl.value.trim().toLowerCase();
  const s = srcEl.value;
  const list = WORDS
    .filter(w => curCat === "全部" || w.cat === curCat)
    .filter(w => curPos === "全部" || w.groups.includes(curPos))
    .filter(w => !s || w.src === s)
    .filter(w => !q || (w.en + w.zh + w.def + w.ex).toLowerCase().includes(q));

  countEl.textContent = '共 ' + list.length + ' 个';
  listEl.innerHTML = '';

  if (!list.length){
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = '没有找到这个单词 🦋';
    listEl.appendChild(e);
    return;
  }

  const frag = document.createDocumentFragment();
  list.forEach(w => {
    const el = document.createElement('div');
    el.className = 'entry';
    el.innerHTML =
      '<div class="top"><span class="en"></span><span class="pos"></span>' +
      (canSpeak ? '<button class="say" title="听发音">🔊</button>' : '') +
      '<span class="tag"></span></div>' +
      '<div class="zh"></div><div class="def"></div>' +
      '<div class="ex"><span class="exen"></span> <span class="exzh"></span></div>' +
      '<div class="src"></div>';
    el.querySelector('.en').textContent = w.en;
    el.querySelector('.pos').textContent = w.pos;
    const c = CATS[w.cat] || {icon:"📝",color:"#eee"};
    const tag = el.querySelector('.tag');
    tag.textContent = c.icon + ' ' + w.cat;
    tag.style.background = c.color;
    el.querySelector('.zh').textContent = w.zh;
    el.querySelector('.def').textContent = w.def;
    el.querySelector('.exen').textContent = '✏️ ' + w.ex;
    el.querySelector('.exzh').textContent = '（' + w.exzh + '）';
    el.querySelector('.src').textContent = '📖 ' + (SOURCES[w.src] || '');
    const btn = el.querySelector('.say');
    if (btn) btn.addEventListener('click', () => say(w.en));
    frag.appendChild(el);
  });
  listEl.appendChild(frag);
}

searchEl.addEventListener('input', render);
buildTabs(); buildChips(); buildSources(); render();
</script>
</body>
